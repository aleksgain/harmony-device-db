name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and pinned metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Verify committed metadata
        run: python3 -I scripts/verify.py

      - name: Check metadata matches archive.lock.json
        run: |
          for f in manifest.json index.json; do
            want=$(jq -r --arg f "$f" '.sha256[$f]' archive.lock.json)
            got=$(sha256sum "api/v1/$f" | cut -d' ' -f1)
            [ "$want" = "$got" ] || { echo "::error file=api/v1/$f::sha256 $got does not match lock ($want)"; exit 1; }
          done

  verify-full:
    name: Verify full pinned archive (sampled)
    # Only when the pin changes; a full fetch is ~0.8 GB.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect lock change
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- archive.lock.json; then
            echo "lock=false" >> "$GITHUB_OUTPUT"
          else
            echo "lock=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned archive
        if: steps.changed.outputs.lock == 'true'
        run: scripts/sync-archive.sh fetch

      - name: Verify archive (5000 sampled devices)
        if: steps.changed.outputs.lock == 'true'
        run: python3 -I scripts/verify.py --full --sample 5000
