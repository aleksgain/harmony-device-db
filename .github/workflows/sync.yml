name: Sync Device DB

on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream data tag to pin (YYYYMMDD). Empty = latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-device-db
  cancel-in-progress: false

jobs:
  sync:
    name: Check upstream and open sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for a new upstream data tag
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          scripts/sync-archive.sh check | tee -a "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            echo "latest=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin new tag and fetch metadata
        if: steps.check.outputs.needs_update == 'true'
        env:
          TAG: ${{ steps.check.outputs.latest }}
        run: scripts/sync-archive.sh update "$TAG"

      # PRs opened with GITHUB_TOKEN do not trigger CI, so the full
      # verification runs here, before the PR is opened.
      - name: Fetch full archive
        if: steps.check.outputs.needs_update == 'true'
        run: scripts/sync-archive.sh fetch

      - name: Verify full archive
        if: steps.check.outputs.needs_update == 'true'
        run: python3 -I scripts/verify.py --full | tee verify.log

      - name: Summarise changes
        if: steps.check.outputs.needs_update == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF_BODY'
            echo "Automated sync of the Harmony IR archive snapshot."
            echo
            echo "- Upstream: https://github.com/$(jq -r .upstream archive.lock.json)/tree/$(jq -r .tag archive.lock.json)"
            echo "- Commit: \`$(jq -r .commit archive.lock.json)\`"
            echo "- Schema version: $(jq -r .schemaVersion archive.lock.json)"
            echo
            echo '```'
            git diff --no-color -U0 -- archive.lock.json | grep -E '^[+-] ' || true
            echo '```'
            echo
            echo "Full verification: \`$(tail -1 verify.log)\`"
            echo
            echo "Merging this PR to \`main\` publishes a new device-db release."
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync device db to ${{ steps.check.outputs.latest }}"
          title: "Device DB: sync to ${{ steps.check.outputs.latest }}"
          body: ${{ steps.summary.outputs.body }}
          branch: sync/archive-${{ steps.check.outputs.latest }}
          delete-branch: true
          labels: device-db-sync
          add-paths: |
            archive.lock.json
            api/v1/manifest.json
            api/v1/index.json
            api/v1/LICENSE-DATA
